# Lexicon for the declarative Logical English subset.
#
# [sorts]      noun surface form -> sort symbol (identity mapping allowed).
# [names]      proper noun (symbol constant) -> its declared sort.
# [predicates] <template> | pred | slot sorts, in slot order
# [meta]       <subject slots> <verb phrase> that <atom> | pred | sorts, _
#
# Template slots are <...> markers; the slot TEXT is a name for the slot, the
# declared sorts on the right are what type-checks a compilation.  '_' means
# "any sort".  Comparison copulas (is before / is on or after / is <N> days
# before) are built in and must NOT be declared here.
#
# A [meta] entry ends with the single <atom> slot: the MENTIONED object-level
# sentence.  It lowers to a reified 'states(<subject>, <pred>, <args...>)' row,
# so the mentioned predicate is a TERM there and a normal USE elsewhere.
#
# A proper noun used in a sentence must be declared in [names]; otherwise its
# sort is unknown and a wrong-sort constant would slip into a slot unchecked.

[sorts]
transaction = transaction
agreement = agreement
confirmation = confirmation
day = day
person = person
player = player
choice = choice
prize = prize
game = game

[names]
IsdaAgreement = agreement
AcmeTransaction = transaction
AcmeConfirmation = confirmation
Wednesday = day
Monday = day
Tuesday = day

[predicates]
<a transaction> is governed by <an agreement>   | governs    | transaction, agreement
<a transaction> commences on <a day>           | commences   | transaction, day
<an agreement> is dated as of <a day>          | dated       | agreement, day
<a confirmation> of <a transaction> is accepted | accepted   | confirmation, transaction
<a confirmation> of <a transaction> is received | received   | confirmation, transaction
<dayA> is the day before <dayB>                | before      | day, day
<dayA> is before <dayB>                        | before      | day, day
<a player> plays <a choice>                    | plays       | player, choice
<a choice> beats <a choice>                    | beats       | choice, choice
<a player> receives <a prize>                  | receives    | player, prize
<a player> is excluded                         | excluded    | player
<a game> is over                               | over        | game
<a day> is a delivery day                      | delivery_day | day
<a player> is eligible                         | eligible    | player

# The meta-level verb phrase: '<subject> states that <mentioned atom>'.  The
# mention is reified as states(<confirmation>, <transaction>, <pred>, <args>),
# so 'governs' is MENTIONED here (a term) and USED in a conclusion.
[meta]
<a confirmation> of <a transaction> states that <atom> | states | confirmation, transaction, _
