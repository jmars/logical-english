# Lexicon for Kowalski 2020, example (1) -- the rock-paper-scissors game.
#
# [sorts]      noun surface form -> sort symbol (identity mapping allowed).
# [names]      proper noun (symbol constant) -> its declared sort.
# [predicates] <template> | pred | slot sorts  -- static knowledge + state.
# [actions]    <template> | pred | slot sorts  -- EXTERNAL EVENTS: what a
#              reactive rule may perform, and what the driver consumes
#              (deletes) once a rule that read it has fired.
#
# A predicate may not be declared in both [predicates] and [actions].

[sorts]
player = player
choice = choice
game = game
prize = prize

[names]
Rock = choice
Paper = choice
Scissors = choice
RpsGame = game
RpsPrize = prize

[predicates]
<a choice> beats <a choice> | beats | choice, choice
<a game> is over | over | game

[actions]
<a player> plays <a choice> | plays | player, choice
<a player> receives <a prize> | receives | player, prize
